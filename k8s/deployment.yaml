apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parking-data-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-app
spec:
  replicas: 1            # the app stores data in a text file, so keep one pod
  strategy:
    type: Recreate       # a ReadWriteOnce volume can't be shared during a rolling update
  selector:
    matchLabels:
      app: parking-app
  template:
    metadata:
      labels:
        app: parking-app
    spec:
      securityContext:
        fsGroup: 1000    # lets the non-root "node" user write to /data
      containers:
        - name: parking-app
          image: songirkar/parking-app:latest   # Jenkins replaces the tag on each build
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: parking-data-pvc
